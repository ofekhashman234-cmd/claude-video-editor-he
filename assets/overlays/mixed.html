<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<!--
  שכבה קדמית לסרטון שמשלב סגנונות (ריאליסטי ← מצויר ← נייר), כמו אצל עדן ביבס, איילון גרופר ובני פרבר.
  עובדת יחד עם behind.html (רקעים paper / navygrid) ועם compose.py --outline (marker / torn).
  window.DATA = {
    words: [{w,s,e}],                                   מ-transcribe.py
    segments: [
      {style:"real",  s:0,    e:1.14, key:"נשארתם", arrow:11.1}   כתוביות גלולה בקבוצות של עד 3 מילים, מילת מפתח בכתום, חץ לתגובות מ-arrow
      {style:"drawn", s:1.1,  e:5.5, caps:true, capTop:110, bulb:3.66}   + כתוביות בכתב יד זוהר למעלה, נורה מצוירת ליד הראש
      {style:"paper", s:5.5,  e:8.9, cuts:[{text:"תנסו", at:5.66, x:60, y:620, rot:-8}, {text:"משחק", at:8, sticker:true, x:..}, {text:"זה כיף", at:8.4, label:true}]}
                                                          מילים גזורות שנוחתות בדיוק כשנאמרות. label = תווית בתחתית, sticker = מדבקה עגולה
      {style:"drawn", s:1.14, e:2.54}                    ניצוצות וחצים בטוש זוהר משני צדי הראש
      {style:"paper", s:2.54, e:3.93, label:"קורה.", at:3.16}   מסקינג טייפ על הכתפיים, תווית מדבקה, גרעין וסטופ-מושן
    ],
    flashes: [1.14, 2.54],                              הבזק לבן בכל מעבר סגנון
    אפקטים גלובליים (לא חייבים):
    stamps: [{text:"דוגרי", at:0.06, dur:0.9, y:220, bg:"#E8202A", color:"#fff", rot:-6, size:150}]   חותמת שנוחתת בגדול ומרעידה
    bursts: [{at:0.95, dur:1.1}]                       קווי מהירות של קומיקס מהשוליים (המרכז נשאר נקי לפנים)
    wipes:  [2.1, 5.56]                                 מעבר מגב: פסים אלכסוניים בצבעי המותג חוצים את המסך
    bars:   [{s:0, e:0.95}]                             פסים שחורים של קולנוע למעלה ולמטה
    leaks:  [{at:8.88, dur:0.8}]                        הבזק אור חם (light leak)
    capY: 1430                                          גובה הכתובית (על החולצה, לא על הפנים)
  }
-->
<style>
@font-face{font-family:Rubik;src:url('../fonts/rubik-hebrew-300-900.woff2') format('woff2');font-weight:300 900;unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Rubik;src:url('../fonts/rubik-latin-300-900.woff2') format('woff2');font-weight:300 900}
@font-face{font-family:Amatic;src:url('../fonts/amatic-sc-hebrew-700.woff2') format('woff2');font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
body{position:relative;contain:paint;width:1080px;height:1920px}
html,body{background:transparent;overflow:hidden;font-family:Rubik,sans-serif}
.S{position:absolute;inset:0;opacity:0}
.pill{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:16px;direction:rtl}
.pill span{display:inline-block;font-weight:800;font-size:92px;color:#111;background:#fff;padding:10px 30px 18px;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.pill span.k{background:#FF6B2C;color:#fff}
svg.dw{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}
.tape{position:absolute;width:250px;height:70px;background:rgba(240,228,190,.82);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.tape::before,.tape::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,0,0,.08) 6px 12px)}
.tape::before{left:0}.tape::after{right:0}
.label{position:absolute;left:0;right:0;display:flex;justify-content:center}
.label b{display:inline-block;font-weight:900;font-size:120px;color:#fff;background:#111;padding:6px 40px 18px;letter-spacing:4px;box-shadow:0 10px 0 #C2261B}
.hw{position:absolute;left:30px;right:30px;display:flex;justify-content:center;flex-wrap:wrap;gap:0 22px;direction:rtl;font-family:Amatic,Rubik;font-weight:700;font-size:150px;line-height:1.05;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.55),0 0 50px rgba(106,75,255,.85)}
.hw span.k{color:#FFC94A}
.cutw{position:absolute;display:flex;gap:6px;direction:rtl}
.cutw b{display:inline-block;font-weight:900;line-height:1;padding:8px 12px 14px;box-shadow:0 8px 14px rgba(0,0,0,.3)}
.stk{position:absolute;width:300px;height:300px;border-radius:50%;background:#FFC94A;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:96px;box-shadow:0 12px 24px rgba(0,0,0,.35);border:10px solid #fff}
.arrow{position:absolute;left:0;right:0;display:flex;justify-content:center}
.grain{position:absolute;inset:0;background:url(../fx/grain.png);mix-blend-mode:multiply;opacity:.35}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,25,10,.45))}
#root,#fx{position:absolute;inset:0}   /* בלי זה, רעידה (transform) הופכת אותם למיכל בגובה 0 והפס התחתון בורח */
.stamp{position:absolute;left:0;right:0;display:flex;justify-content:center}
.stamp b{display:inline-block;font-weight:900;padding:6px 36px 16px;border:8px solid #fff;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.bar{position:absolute;left:0;right:0;height:200px;background:#000}
.wipe{position:absolute;top:-400px;width:700px;height:2800px;transform:rotate(18deg)}
.leak{position:absolute;inset:0;background:radial-gradient(ellipse at 85% 15%,rgba(255,150,60,.85),rgba(255,80,120,.35) 35%,transparent 65%);mix-blend-mode:screen}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body><div id="root"></div><div id="fx"></div><div id="flash"></div>
<script>
const D = window.DATA || {}, W = D.words || [], SEG = D.segments || [], root = document.getElementById('root');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(9 * x);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm = w => w.replace(/[.,!?:;"'״׳()]/g, '');
const capY = D.capY ?? 1430;
const star = (x, y, r) => `M${x} ${y - r} L${x + r * .25} ${y - r * .25} L${x + r} ${y} L${x + r * .25} ${y + r * .25} L${x} ${y + r} L${x - r * .25} ${y + r * .25} L${x - r} ${y} L${x - r * .25} ${y - r * .25} Z`;
const PAL = [['#fff','#111'],['#111','#fff'],['#FF6B2C','#fff'],['#FFC94A','#111'],['#f4f1ea','#C2261B'],['#1F6FE0','#fff']];
// קבוצות של עד 3 מילים, נשברות גם בסימן פיסוק. כל קבוצה מוצגת מתחילתה ועד תחילת הבאה
const chunks = (g) => { const ws = W.filter(w => w.s >= g.s - 0.01 && w.s < g.e), out = []; let cur = [];
  for (const w of ws) { cur.push(w); if (cur.length >= 3 || /[.,!?]$/.test(w.w)) { out.push(cur); cur = []; } }
  if (cur.length) out.push(cur); return out.map((c, i) => ({ c, s: c[0].s, e: i + 1 < out.length ? out[i + 1][0].s : g.e })); };
const segs = SEG.map(g => {
  const el = document.createElement('div'); el.className = 'S'; root.appendChild(el);
  if (g.style === 'real') {
    g.ch = chunks(g);
    el.innerHTML = g.ch.map(k => `<div class="pill" data-s="${k.s}" data-e="${k.e}" style="top:${capY}px">${k.c.map(w => `<span class="${g.key && norm(w.w) === norm(g.key) ? 'k' : ''}" data-s="${w.s}">${esc(w.w)}</span>`).join('')}</div>`).join('')
      + (g.arrow != null ? `<svg class="dw arrow-svg"><path d="M540 1560 L540 1760 M470 1690 L540 1770 L610 1690" stroke="#FF6B2C" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))"/></svg>` : '');
  }
  if (g.style === 'drawn') {
    const P = [[star(170, 430, 46), '#FFC94A'], [star(910, 380, 38), '#fff'], [star(960, 560, 22), '#FFC94A'], [star(120, 600, 24), '#fff'],
               ['M60 1180 q60 -120 150 -150', '#fff'], ['M190 1050 l30 -10 m-30 10 l10 28', '#fff'],
               ['M1020 1180 q-60 -120 -150 -150', '#FFC94A'], ['M890 1050 l-30 -10 m30 10 l-10 28', '#FFC94A']];
    const bulb = g.bulb != null ? (() => { const bx = g.bulbX ?? 170, by = g.bulbY ?? 640;
      return [[`M${bx - 60} ${by} a60 60 0 1 1 120 0 c0 40 -30 55 -30 90 h-60 c0 -35 -30 -50 -30 -90 z`, '#FFC94A'], [`M${bx - 28} ${by + 110} h56 M${bx - 22} ${by + 135} h44`, '#FFC94A'],
        [`M${bx} ${by - 100} v-40 M${bx - 95} ${by - 60} l-28 -28 M${bx + 95} ${by - 60} l28 -28 M${bx - 120} ${by + 20} h-40 M${bx + 120} ${by + 20} h40`, '#fff']]; })() : [];
    g.nb = bulb.length;
    el.innerHTML = (g.caps ? chunks(g).map(k => `<div class="hw" data-s="${k.s}" data-e="${k.e}" style="top:${g.capTop ?? 110}px">${k.c.map(w => `<span class="${g.key && norm(w.w) === norm(g.key) ? 'k' : ''}" data-s="${w.s}">${esc(w.w)}</span>`).join('')}</div>`).join('') : '')
      + `<svg class="dw">${bulb.map(([d, c]) => `<path class="bulb" d="${d}" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 12px ${c})"/>`).join('')}</svg>`
      + `<svg class="dw">${P.map(([d, c]) => `<path d="${d}" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 10px ${c})"/>`).join('')}</svg>`;
    el.querySelectorAll('path').forEach(p => { const L0 = p.getTotalLength(); p.dataset.len = L0; p.style.strokeDasharray = L0; p.style.strokeDashoffset = L0; });
  }
  if (g.style === 'paper') {
    el.innerHTML = `<div class="grain"></div><div class="vig"></div>
      <div class="tape" style="left:-30px;top:1080px;transform:rotate(-38deg)"></div><div class="tape" style="right:-30px;top:1060px;transform:rotate(34deg)"></div>
      ${g.label ? `<div class="label main" style="top:${capY}px"><b>${esc(g.label)}</b></div>` : ''}
      ${(g.cuts || []).map((c, j) => c.label ? `<div class="label cut-i" data-at="${c.at}" data-until="${c.until ?? 99}" style="top:${capY}px"><b>${esc(c.text)}</b></div>`
        : c.sticker ? `<div class="stk cut-i" data-at="${c.at}" data-until="${c.until ?? 99}" data-rot="${c.rot ?? 12}" style="left:${c.x ?? 700}px;top:${c.y ?? 1250}px">${esc(c.text)}</div>`
        : `<div class="cutw cut-i" data-at="${c.at}" data-until="${c.until ?? 99}" data-rot="${c.rot ?? 0}" style="left:${c.x ?? 60}px;top:${c.y ?? 600}px">${[...c.text].map((ch, i) => `<b style="background:${PAL[(i + j * 2) % 6][0]};color:${PAL[(i + j * 2) % 6][1]};font-size:${c.size || 110}px;font-family:${(i + j) % 2 ? 'Georgia,serif' : 'Rubik'}">${esc(ch)}</b>`).join('')}</div>`).join('')}`;
  }
  return { g, el };
});
const fx = document.getElementById('fx');
const ST = (D.stamps || []).map(st => { const el = document.createElement('div'); el.className = 'stamp'; el.style.top = (st.y ?? 220) + 'px';
  el.innerHTML = `<b style="background:${st.bg || '#E8202A'};color:${st.color || '#fff'};font-size:${st.size || 150}px">${esc(st.text)}</b>`; fx.appendChild(el); return { st, el }; });
const BU = (D.bursts || []).map(bu => { const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); el.setAttribute('class', 'dw'); fx.appendChild(el); return { bu, el }; });
const BA = (D.bars || []).map(b => { const t1 = document.createElement('div'), t2 = document.createElement('div'); t1.className = t2.className = 'bar'; t1.style.top = '0'; t2.style.bottom = '0'; fx.append(t1, t2); return { b, t1, t2 }; });
const WI = (D.wipes || []).map(w => { const el = document.createElement('div'); el.style.cssText = 'position:absolute;inset:0;overflow:hidden';
  el.innerHTML = ['#FF6B2C', '#6A4BFF', '#FFC94A'].map((c, i) => `<div class="wipe" style="background:${c}" data-i="${i}"></div>`).join(''); fx.appendChild(el); return { w, el }; });
const LE = (D.leaks || []).map(l => { const el = document.createElement('div'); el.className = 'leak'; fx.appendChild(el); return { l, el }; });
const rnd = k => { const x = Math.sin(k * 127.1) * 43758.5453; return x - Math.floor(x); };
function renderFx(t) {
  let shake = 0;
  for (const { st, el } of ST) { const x = t - st.at, on = x >= 0 && x < (st.dur ?? 0.9); el.style.opacity = on ? 1 : 0; if (!on) continue;
    const k = clamp(x / 0.12), sc = 2.4 - 1.4 * k; if (x < 0.25) shake = Math.max(shake, 18 * (1 - x / 0.25));
    el.firstChild.style.transform = `rotate(${st.rot ?? -6}deg) scale(${sc})`; }
  for (const { bu, el } of BU) { const x = t - bu.at, on = x >= 0 && x < (bu.dur ?? 1); el.style.opacity = on ? 1 : 0; if (!on) continue;
    const f = Math.floor(x * 24); let h = '';   // קווים חדשים בכל פריים, כמו בקומיקס
    for (let i = 0; i < 46; i++) { const a = (i / 46) * Math.PI * 2 + rnd(f * 99 + i) * 0.12, r0 = 640 + rnd(f * 7 + i) * 260, r1 = 1300;
      const cx = 540, cy = 860; h += `<path d="M${cx + Math.cos(a) * r0 * 0.75} ${cy + Math.sin(a) * r0} L${cx + Math.cos(a) * r1} ${cy + Math.sin(a) * r1 * 1.3}" stroke="#fff" stroke-width="${3 + rnd(f + i * 3) * 9}" opacity=".85"/>`; }
    el.innerHTML = h; }
  for (const { b, t1, t2 } of BA) { const on = t >= b.s && t < b.e; const k = on ? clamp((t - b.s) / 0.25) * clamp((b.e - t) / 0.15) : 0;
    t1.style.transform = `translateY(${-200 * (1 - k)}px)`; t2.style.transform = `translateY(${200 * (1 - k)}px)`; t1.style.opacity = t2.style.opacity = k > 0 ? 1 : 0; }
  for (const { w, el } of WI) { const x = (t - w + 0.2) / 0.4; el.style.opacity = x > 0 && x < 1 ? 1 : 0;
    el.querySelectorAll('.wipe').forEach(p => { const i = +p.dataset.i; p.style.left = `${-900 + (x - i * 0.08) * 2900}px`; }); }
  for (const { l, el } of LE) { const x = (t - l.at) / (l.dur ?? 0.8); el.style.opacity = x > 0 && x < 1 ? Math.sin(x * Math.PI) : 0; }
  root.style.transform = fx.style.transform = shake ? `translate(${Math.sin(t * 97) * shake}px,${Math.cos(t * 83) * shake}px)` : '';
}
window.CONFIG = { W: 1080, H: 1920 };
window.render = function (t) {
  for (const { g, el } of segs) {
    const on = t >= g.s && t < g.e; el.style.opacity = on ? 1 : 0;
    if (!on) continue; const u = t - g.s;
    if (g.style === 'real') {
      el.querySelectorAll('.pill').forEach(pl => { pl.style.display = t >= +pl.dataset.s && t < +pl.dataset.e ? 'flex' : 'none'; });
      el.querySelectorAll('.pill span').forEach(sp => {
        const x = (t - +sp.dataset.s) / 0.22; sp.style.opacity = clamp(x * 4); sp.style.transform = `scale(${0.6 + 0.4 * spring(x)})`; });
      const ar = el.querySelector('.arrow-svg'); if (ar) { const x = t - g.arrow; ar.style.opacity = x > 0 ? 1 : 0; ar.style.transform = `translateY(${x > 0 ? Math.abs(Math.sin(x * 6)) * 30 - (1 - spring(x / 0.4)) * 120 : 0}px)`; }
    }
    if (g.style === 'drawn') {
      el.querySelectorAll('path').forEach((p, i) => { const st = p.classList.contains('bulb') ? g.bulb - g.s + i * 0.12 : 0.15 + (i - g.nb) * 0.07;
        p.style.strokeDashoffset = p.dataset.len * (1 - clamp((u - st) / 0.3)); });
      el.querySelectorAll('.hw').forEach(h => { h.style.display = t >= +h.dataset.s && t < +h.dataset.e ? 'flex' : 'none'; });
      el.querySelectorAll('.hw span').forEach(sp => { const x = (t - +sp.dataset.s) / 0.3; sp.style.opacity = clamp(x * 3); sp.style.transform = `translateY(${(1 - spring(x)) * 50}px) rotate(${(1 - spring(x)) * -6}deg)`; });
      const f = Math.floor(u * 8); el.querySelector('svg').style.transform = `translate(${Math.sin(f * 2.3) * 3}px,${Math.cos(f * 1.7) * 3}px)`;   // רעד של ציור יד
    }
    if (g.style === 'paper') {
      const f = Math.floor(u * 8);   // סטופ-מושן: 8 פריימים בשנייה
      el.querySelectorAll('.tape').forEach((tp, i) => { const shown = f >= 1 + i; tp.style.opacity = shown ? 1 : 0; });
      const lb = el.querySelector('.label.main b');
      if (lb) { const x = (t - (g.at ?? g.s)) / 0.25; lb.style.opacity = x > 0 ? 1 : 0; lb.style.transform = `rotate(${-3 + Math.sin(f * 1.3)}deg) scale(${x < 1 ? 1.35 - 0.35 * spring(x) : 1})`; }
      el.querySelectorAll('.cut-i').forEach(c => { const x = t - +c.dataset.at, on2 = x >= 0 && t < +c.dataset.until; c.style.opacity = on2 ? 1 : 0; if (!on2) return;
        const r = +(c.dataset.rot || 0) + (Math.floor(x * 12) < 2 ? 4 : 0);   // נחיתה בסטופ-מושן: שני פריימים גדול ועקום, ואז נעול
        if (c.classList.contains('label')) { const b = c.querySelector('b'); b.style.transform = `rotate(${-3 + Math.sin(f * 1.3)}deg) scale(${x < 0.17 ? 1.3 : 1})`; }
        else c.style.transform = `rotate(${r}deg) scale(${x < 0.17 ? 1.3 : 1})`; });
      el.querySelector('.grain').style.backgroundPosition = `${(f * 137) % 400}px ${(f * 59) % 400}px`;
    }
  }
  renderFx(t);
  let fl = 0; for (const s of D.flashes || []) if (t >= s) fl = Math.max(fl, 1 - (t - s) / 0.14);
  document.getElementById('flash').style.opacity = clamp(fl) * 0.9;
};
window.render(0);
</script></body></html>
